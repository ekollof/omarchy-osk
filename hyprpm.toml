# hyprpm manifest — makes the compositor plugin installable with:
#   hyprpm update          (headers first; needs sudo + cmake, cpio,
#                           hyprwayland-scanner, gcc, g++, pkg-config, git)
#   hyprpm add <this-repo>
#   hyprpm enable hypr-osk
# The plugin .so then lives at /var/cache/hyprpm/<user>/hypr-osk/hypr-osk.so
# and osk.lua picks it up at session start (install.sh's flat copy is
# preferred when both exist; the loader guards against double-loads).
# commit_pins: running-Hyprland-commit -> last-known-good plugin commit.
# Hyprland v0.56.2 efb50993780079460b0cbed1363e2166a2de1d9f.
# Hyprland v0.57.0 0aa6745f705f2c4b0a5004eb019ef76e5bbdb426.
# Vendored hyprgrass/wf-touch pins: docs/PINS.md (install.sh is the primary
# path and builds this tree; hyprpm is optional).
[repository]
repository = "https://github.com/ekollof/omarchy-osk"
name = "hypr-osk"
authors = ["ekollof"]
commit_pins = [
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "556a2f421a540c4bb5dfcfc5ea2515e22942c55a"],
    ["0aa6745f705f2c4b0a5004eb019ef76e5bbdb426", "47714a4e37c9c5ef5ab900ec761f5b70fb038061"],
]

[hypr-osk]
description = "On-screen keyboard: touchscreen-to-pointer emulation + synthetic keyboard injection"
output = "build/libhypr-osk.so"
build = [
    "rm -rf build && meson setup build hypr-osk",
    "meson compile -C build",
]
